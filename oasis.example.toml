[server]
host = "0.0.0.0"
port = 4533
database = "oasis.db"     # relative paths resolve against this file's directory

[library]
paths = ["~/Music"]
dedupe = false    # store each audio stream once: copies of a song in several editions become reflinks of the best one,
                  # each keeping its own tags. Needs the library writable and on btrfs or XFS.

[artists]
# One MusicBrainz artist is one artist whatever the spelling; these settle what MusicBrainz can't. Admins edit them on
# the dashboard (Artist settings), which shows what MusicBrainz already has. merge and related always apply, beside the
# rows added there; separate is used until saved there.
# merge = [["Stachursky", "Stachurski"]]              # the later names become the first; downloads search by them too
# separate = ["Phoenix"]                              # never merged into an artist that goes by it too
# related = [["Mori Calliope", "DEMONDICE"]]          # separate artists that belong together: shown first among
                                                      # similar artists and mixed into each other's radios

[ytmusic]
enabled = false   # offer YouTube Music to users (they turn it on in Services); admins change it there while oasis runs
cache = "cache"   # downloaded audio; tracks you star or add to a playlist download right away

[lastfm]
# App credentials from https://www.last.fm/api/account/create, or entered by an admin on the Services page. Each user
# who turns Last.fm on gets its similar tracks in radios, and can sign in there to scrobble.
api_key = ""
secret = ""

# Starred albums and artists are searched on Prowlarr and downloaded through TorBox (README → Getting music).
# [torbox]
# rdt_db = "/rdt/rdtclient.db"
# downloads = "/downloads/oasis"
# [prowlarr]
# url = "http://prowlarr:9696"
# api_key = ""

# Admins: this password signs in to the dashboard. Apps use app passwords made there. More users can be added on
# the dashboard (http://<host>:4533/admin).
[[users]]
name = "admin"
password = "change-me"
