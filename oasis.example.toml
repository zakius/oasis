[server]
host = "0.0.0.0"
port = 4533
database = "oasis.db"     # relative paths resolve against this file's directory

[library]
paths = ["~/Music"]

[ytmusic]
enabled = false   # search YouTube Music and stream from it
cache = "cache"   # downloaded audio; tracks you star or add to a playlist download right away

[lastfm]
# App credentials from https://www.last.fm/api/account/create. Each user then signs in to Last.fm on the account page;
# the key also adds Last.fm's similar tracks to radios.
api_key = ""
secret = ""

# Starred albums and artists are downloaded through Lidarr (see README).
# [lidarr]
# url = "http://lidarr:8686"
# api_key = ""

# Admins. More users can be added on the account page (http://<host>:4533/admin) or with Subsonic's createUser.
[[users]]
name = "admin"
password = "change-me"
