[project]
name = "oasis-server"
version = "0.1.0"
description = "OpenSubsonic server that merges a local library with streaming services into one seamless library"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["starlette>=0.39", "uvicorn>=0.30", "mutagen>=1.47"]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]

[project.scripts]
oasis = "oasis.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oasis"]
